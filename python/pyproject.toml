[project]
name = "agentic-lab"
version = "0.2.0"
description = "Expert course: hand-coded agents, hallucination checks, sampling controls, and rate limits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.0",
  "langgraph>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic-lab = "agentic_lab.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_lab*"]
